name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 1. Compilación de cada plataforma
  build:
    name: Compilar para ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Dependencias de compilación para Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libarchive-tools zstd
          sudo snap install snapcraft --classic || true

      - name: Compilar instaladores (sin publicar directo)
        run: npm run build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asegurar artefacto MSIX (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          for f in dist/*.appx; do
            if [ -f "$f" ]; then
              msix_file="${f%.appx}.msix"
              if [ ! -f "$msix_file" ]; then
                cp "$f" "$msix_file"
                echo "MSIX generated: $msix_file"
              fi
            fi
          done

      # Guarda los instaladores resultantes temporalmente
      - name: Guardar instaladores como artefactos
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.appx
            dist/*.msix
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.snap
            dist/*.pacman
            dist/*.pkg.tar.xz
            dist/*.pkg.tar.zst
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: warn

  # 2. Publicación unificada
  release:
    name: Publicar Release Única
    needs: build # Espera a que Windows, Mac y Linux terminen
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # Descarga todos los archivos de los 3 sistemas en una sola carpeta
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolver Tag de Release
        id: release_tag
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Extraer notas de lanzamiento
        id: extract_notes
        run: |
          node -e '
            const fs = require("fs");
            const changelogFile = fs.existsSync("changelog-dev.md") ? "changelog-dev.md" : "changelog.md";
            const content = fs.readFileSync(changelogFile, "utf8");
            const match = content.match(/##\s+\[([0-9]+\.[0-9]+\.[0-9]+[^\]]*)\][^\n]*\n([\s\S]*?)(?=\n##\s+\[|\s*$)/);
            if (match) {
              const notes = `## Registro de Cambios - v${match[1]}\n\n${match[2].trim()}`;
              fs.writeFileSync("RELEASE_NOTES.md", notes, "utf8");
            } else {
              fs.writeFileSync("RELEASE_NOTES.md", "Release de WhatsNexus", "utf8");
            }
          '

      # Crea una única release con todos los instaladores juntos
      - name: Publicar Release Única
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.release_tag.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
